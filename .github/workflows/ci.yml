name: 🛡️ Security Baseline & CI Protection Pipeline

on:
  pull_request:
    branches: [main, develop, staging]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-baseline:
    name: 🛡️ Security Baseline, Secrets & Dependency Protections
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: clearshift
          POSTGRES_DB: clearshift_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearshift -d clearshift_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://clearshift@localhost:5432/clearshift_test
      DATABASE_URL_TEST: postgresql://clearshift@localhost:5432/clearshift_test
      DATABASE_MIGRATOR_URL: postgresql://clearshift@localhost:5432/clearshift_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 🔍 Automated Dependency Vulnerability Audit
        run: |
          chmod +x ./infra/security/dependency-audit.sh
          ./infra/security/dependency-audit.sh

      - name: 🔑 Secret & Credential Scan
        run: |
          chmod +x ./infra/security/secret-scan.sh
          ./infra/security/secret-scan.sh

      - name: ☁️ Cloud Uploader & Fixture Integrity Audit
        run: |
          chmod +x ./infra/security/repo-audit.sh
          ./infra/security/repo-audit.sh

      - name: 📐 Monorepo TypeScript Typecheck
        run: |
          npm run typecheck

      - name: 🔎 Linter & Code Quality
        run: |
          npm run lint

      - name: ⚡ Controlled Database Migrations
        run: |
          node infra/scripts/db-migrate.ts

      - name: 🌱 Seed Synthetic Baseline Data
        run: |
          node infra/scripts/seed.ts

      - name: 🧪 Run Monorepo Test Suite
        run: |
          npm test

