openapi: 3.1.0
info:
  title: ClearShift CRM — CRM-5 Migration Control Center & Reports API
  version: 1.0.0
  description: Public contract for migration run projections, data quality scores, reject inspection, and reconciliation reporting.

servers:
  - url: /api/v1/crm-control
    description: V1 Control Center API Base

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service status and module version.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  module:
                    type: string
                    example: crm-5
                  version:
                    type: string
                    example: 1.0.0

  /runs:
    get:
      summary: List migration run projections
      description: Returns bounded paginated migration run events across CRM modules. Page size is capped at 100.
      operationId: getMigrationRuns
      parameters:
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        - name: batchId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, completed, failed, halted]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of migration runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunsResponse'
        '400':
          description: Bad Request (invalid query or pageSize > 100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Ingest or update migration run projection
      description: Ingests run execution state with idempotency deduplication and domain count validation.
      operationId: postMigrationRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunInput'
      responses:
        '201':
          description: Run projection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationRun'
        '200':
          description: Idempotent duplicate run projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationRun'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict (illegal state transition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Unprocessable Entity (business count violation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /scores:

    get:
      summary: List data quality scores
      description: Returns quality scores across 5 dimensions and the overall average score. Page size is capped at 100.
      operationId: getQualityScores
      parameters:
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        - name: batchId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Quality scores and system average
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoresResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Ingest quality score
      description: Ingests quality score dimensions and computes overall weighted quality score.
      operationId: postQualityScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoreInput'
      responses:
        '201':
          description: Quality score created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityScore'
        '200':
          description: Idempotent duplicate quality score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityScore'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Unprocessable Entity (dimension out of 0..1 bounds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rejects:

    get:
      summary: List migration reject projections
      description: Audits failed records row-by-row with error codes and sanitized hashes. Page size is capped at 100.
      operationId: getMigrationRejects
      parameters:
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        - name: batchId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of rejected rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRejectsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      summary: Ingest migration reject audit record
      description: Ingests rejected record audit with sanitized/escaped error message to prevent CSV formula injection.
      operationId: postMigrationReject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRejectInput'
      responses:
        '201':
          description: Rejection record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationReject'
        '200':
          description: Idempotent duplicate rejection record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationReject'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Unprocessable Entity (e.g. rowIndex < 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /reconciliation:
    post:
      summary: Ingest and verify batch reconciliation report
      description: Verifies exact 4-term conservation equation Source = Loaded + Rejected + Merged + Skipped + Unaccounted. Status is OK only if Unaccounted = 0.
      operationId: postBatchReconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReconciliationInput'
      responses:
        '201':
          description: Reconciliation report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'
        '200':
          description: Idempotent duplicate reconciliation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict (reconciliation report already exists for batch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Unprocessable Entity (negative counts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /reconciliation/{batch}:

    get:
      summary: Get batch reconciliation balance sheet
      description: Verifies exact equation Source = Loaded + Rejected + Merged + Skipped + Unaccounted. Status is OK only if Unaccounted = 0.
      operationId: getBatchReconciliation
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reconciliation report for the requested batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Batch reconciliation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /batches/{batch}:
    get:
      summary: Get aggregated batch summary and read-model consistency
      description: Returns aggregated batch lifecycle status, progress totals, and cross-entity consistency evaluation.
      operationId: getBatchSummary
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aggregated batch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Batch summary not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:

  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
              example: pageSize cannot exceed 100
            details:
              type: object

    MigrationRun:
      type: object
      required:
        - id
        - batchId
        - module
        - step
        - status
        - recordsIn
        - recordsOut
        - recordsRejected
        - startedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        step:
          type: string
          enum: [extract, profile, clean, map, load, validate, reconcile]
        status:
          type: string
          enum: [pending, running, completed, failed, halted]
        recordsIn:
          type: integer
          minimum: 0
        recordsOut:
          type: integer
          minimum: 0
        recordsRejected:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedRunsResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MigrationRun'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    QualityScore:
      type: object
      required:
        - id
        - batchId
        - module
        - isFullyScored
        - scoredAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
        completeness:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        validity:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        duplicateRate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        rejectRate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        linkIntegrity:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        isFullyScored:
          type: boolean
        scoredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ScoresResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QualityScore'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        limit:
          type: integer
        averageScore:
          type: number
          nullable: true

    MigrationReject:
      type: object
      required:
        - id
        - batchId
        - module
        - rowIndex
        - errorCode
        - errorMessage
        - rawPayloadHash
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
        rowIndex:
          type: integer
          minimum: 1
        errorCode:
          type: string
        errorMessage:
          type: string
        rawPayloadHash:
          type: string
        createdAt:
          type: string
          format: date-time

    PaginatedRejectsResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MigrationReject'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        limit:
          type: integer

    ReconciliationReport:
      type: object
      required:
        - id
        - batchId
        - module
        - sourceCount
        - loadedCount
        - rejectedCount
        - mergedCount
        - skippedCount
        - unaccountedCount
        - status
        - reconciledAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
        sourceCount:
          type: integer
          minimum: 0
        loadedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        mergedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        unaccountedCount:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [OK, UNBALANCED]
        reconciledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateRunInput:
      type: object
      required:
        - batchId
        - module
        - step
      properties:
        batchId:
          type: string
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        step:
          type: string
          enum: [extract, profile, clean, map, load, validate, reconcile]
        status:
          type: string
          enum: [pending, running, completed, failed, halted]
          default: pending
        recordsIn:
          type: integer
          minimum: 0
          default: 0
        recordsOut:
          type: integer
          minimum: 0
          default: 0
        recordsRejected:
          type: integer
          minimum: 0
          default: 0
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          nullable: true
        idempotencyKey:
          type: string

    CreateScoreInput:
      type: object
      required:
        - batchId
        - module
      properties:
        batchId:
          type: string
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        completeness:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        validity:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        duplicateRate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        rejectRate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        linkIntegrity:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        idempotencyKey:
          type: string

    CreateReconciliationInput:
      type: object
      required:
        - batchId
        - module
        - sourceCount
        - loadedCount
        - rejectedCount
      properties:
        batchId:
          type: string
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        sourceCount:
          type: integer
          minimum: 0
        loadedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        mergedCount:
          type: integer
          minimum: 0
          default: 0
        skippedCount:
          type: integer
          minimum: 0
          default: 0
        idempotencyKey:
          type: string

    CreateRejectInput:
      type: object
      required:
        - batchId
        - module
        - rowIndex
        - errorCode
        - errorMessage
        - rawPayloadHash
      properties:
        batchId:
          type: string
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        rowIndex:
          type: integer
          minimum: 1
        errorCode:
          type: string
        errorMessage:
          type: string
        rawPayloadHash:
          type: string
        idempotencyKey:
          type: string

    BatchTotals:
      type: object
      required:
        - totalRecordsIn
        - totalRecordsOut
        - totalRecordsRejected
        - stepsCompleted
        - stepsTotal
        - progressPercentage
      properties:
        totalRecordsIn:
          type: integer
          minimum: 0
        totalRecordsOut:
          type: integer
          minimum: 0
        totalRecordsRejected:
          type: integer
          minimum: 0
        stepsCompleted:
          type: integer
          minimum: 0
        stepsTotal:
          type: integer
          minimum: 1
        progressPercentage:
          type: integer
          minimum: 0
          maximum: 100

    BatchConsistency:
      type: object
      required:
        - isConsistent
        - warnings
        - errors
      properties:
        isConsistent:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string

    BatchSummary:
      type: object
      required:
        - batchId
        - module
        - status
        - totals
        - consistency
        - updatedAt
      properties:
        batchId:
          type: string
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        status:
          type: string
          enum: [pending, running, completed, failed, halted]
        totals:
          $ref: '#/components/schemas/BatchTotals'
        score:
          $ref: '#/components/schemas/QualityScore'
          nullable: true
        reconciliation:
          $ref: '#/components/schemas/ReconciliationReport'
          nullable: true
        consistency:
          $ref: '#/components/schemas/BatchConsistency'
        updatedAt:
          type: string
          format: date-time


