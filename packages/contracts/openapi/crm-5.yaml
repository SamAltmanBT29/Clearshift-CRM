openapi: 3.1.0
info:
  title: ClearShift CRM — CRM-5 Migration Control Center & Reports API
  version: 1.0.0
  description: Public contract for migration run projections, data quality scores, reject inspection, and reconciliation reporting.

servers:
  - url: /api/v1/crm-control
    description: V1 Control Center API Base

paths:
  /runs:
    get:
      summary: List migration run projections
      description: Returns bounded paginated migration run events across CRM modules.
      operationId: getMigrationRuns
      parameters:
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        - name: batchId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, completed, failed, halted]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of migration runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunsResponse'

  /scores:
    get:
      summary: List data quality scores
      description: Returns quality scores across 5 dimensions and the overall average score.
      operationId: getQualityScores
      parameters:
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        - name: batchId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Quality scores and system average
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoresResponse'

  /rejects:
    get:
      summary: List migration reject projections
      description: Audits failed records row-by-row with error codes and sanitized hashes.
      operationId: getMigrationRejects
      parameters:
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        - name: batchId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of rejected rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRejectsResponse'

  /reconciliation/{batch}:
    get:
      summary: Get batch reconciliation balance sheet
      description: Verifies exact equation Source = Loaded + Rejected + Merged + Skipped + Unaccounted. Status is OK only if Unaccounted = 0.
      operationId: getBatchReconciliation
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reconciliation report for the requested batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'
        '404':
          description: Batch reconciliation not found

components:
  schemas:
    MigrationRun:
      type: object
      required:
        - id
        - batchId
        - module
        - step
        - status
        - recordsIn
        - recordsOut
        - recordsRejected
        - startedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        step:
          type: string
          enum: [extract, profile, clean, map, load, validate, reconcile]
        status:
          type: string
          enum: [pending, running, completed, failed, halted]
        recordsIn:
          type: integer
          minimum: 0
        recordsOut:
          type: integer
          minimum: 0
        recordsRejected:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedRunsResponse:
      type: object
      required:
        - items
        - total
        - page
        - limit
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MigrationRun'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    QualityScore:
      type: object
      required:
        - id
        - batchId
        - module
        - isFullyScored
        - scoredAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
        completeness:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        validity:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        duplicateRate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        rejectRate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        linkIntegrity:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        isFullyScored:
          type: boolean
        scoredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ScoresResponse:
      type: object
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QualityScore'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        averageScore:
          type: number
          nullable: true

    MigrationReject:
      type: object
      required:
        - id
        - batchId
        - module
        - rowIndex
        - errorCode
        - errorMessage
        - rawPayloadHash
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
        rowIndex:
          type: integer
          minimum: 1
        errorCode:
          type: string
        errorMessage:
          type: string
        rawPayloadHash:
          type: string
        createdAt:
          type: string
          format: date-time

    PaginatedRejectsResponse:
      type: object
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MigrationReject'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ReconciliationReport:
      type: object
      required:
        - id
        - batchId
        - module
        - sourceCount
        - loadedCount
        - rejectedCount
        - mergedCount
        - skippedCount
        - unaccountedCount
        - status
        - reconciledAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
        sourceCount:
          type: integer
          minimum: 0
        loadedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        mergedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        unaccountedCount:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [OK, UNBALANCED]
        reconciledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
