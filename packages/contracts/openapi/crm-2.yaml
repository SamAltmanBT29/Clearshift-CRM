openapi: 3.1.0
info:
  title: ClearShift CRM-2 Deals, Pipeline and Quotes API
  description: Public module contract for CRM-2 (Deals, Pipeline stages, Quotes).
  version: 1.0.0
servers:
  - url: /api/v1/crm-deals
    description: V1 Base Endpoint

paths:
  /health:
    get:
      summary: Service health check
      operationId: getHealth
      description: Returns health status, module identifier, and service metadata
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /deals:
    get:
      summary: List deals with search, stage filter, and server-side pagination
      operationId: listDeals
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-based)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of records per page (capped at 100)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Alternative limit parameter for records per page (capped at 100)
            minimum: 1
            maximum: 100
          description: Number of records per page (capped at 100)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Alternative limit parameter for records per page (capped at 100)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Free-text search matching deal name or contact name
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StageName'
          description: Filter deals by pipeline stage
      responses:
        '200':
          description: Paginated deals list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealsListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new deal
      operationId: createDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDealInput'
      responses:
        '201':
          description: Deal created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Referential integrity error (contact not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deals/{id}:
    get:
      summary: Retrieve a single deal by ID
      operationId: getDealById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '404':
          description: Deal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update an existing deal
      operationId: updateDeal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDealInput'
      responses:
        '200':
          description: Deal updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid state transition or referential integrity error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stages:
    get:
      summary: Retrieve fixed pipeline stages
      operationId: listStages
      description: Returns the fixed seed stages in pipeline order (New, Qualified, Proposal, Negotiation, Won, Lost)
      responses:
        '200':
          description: List of pipeline stages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagesListResponse'

  /quotes:
    get:
      summary: List quotes
      operationId: listQuotes
      parameters:
        - name: deal_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter quotes by deal ID
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of records per page (capped at 100)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Alternative limit parameter for records per page (capped at 100)
      responses:
        '200':
          description: Paginated quotes list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesListResponse'

    post:
      summary: Create a quote for a deal
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteInput'
      responses:
        '201':
          description: Quote created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate quote number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Referential integrity error (deal not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quotes/{id}:
    get:
      summary: Retrieve a single quote by ID
      operationId: getQuoteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Quote details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update a quote
      operationId: updateQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuoteInput'
      responses:
        '200':
          description: Quote updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate quote number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /import:
    post:
      summary: Ingest migration batch rows with idempotency guarantees (KIT-08 Target Adapter)
      operationId: importRow
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Stable idempotency key for exactly-once processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Crm2ImportRow'
      responses:
        '201':
          description: Row processed and target mutation committed with receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crm2ImportResult'
        '200':
          description: Idempotent replay; original receipt returned without second mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crm2ImportResult'
        '400':
          description: Invalid import payload or missing Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied (requires MIGRATION_RUNNER or ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict (key reused with different payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Domain validation failure or unresolved cross-module reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /import/row:
    post:
      summary: Ingest single migration row with idempotency guarantees (KIT-08 Target Adapter)
      operationId: importSingleRow
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Stable idempotency key for exactly-once processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Crm2ImportRow'
      responses:
        '201':
          description: Row processed and target mutation committed with receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crm2ImportResult'
        '200':
          description: Idempotent replay; original receipt returned without second mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crm2ImportResult'
        '400':
          description: Invalid import payload or missing Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied (requires MIGRATION_RUNNER or ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict (key reused with different payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Domain validation failure or unresolved cross-module reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /import/batch:
    post:
      summary: Batch ingest migration rows using type-safe UPSERT operations (KIT-08 loadBatch)
      operationId: loadBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Crm2BatchImportRequest'
      responses:
        '200':
          description: Batch execution complete with loaded results and error ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crm2BatchImportResponse'
        '400':
          description: Invalid batch payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied (requires MIGRATION_RUNNER or ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /import/receipts:
    get:
      summary: List durable migration import receipts
      operationId: listImportReceipts
      responses:
        '200':
          description: List of migration receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crm2ImportReceiptsResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /import/receipts/{idempotencyKey}:
    get:
      summary: Retrieve a single durable import receipt by idempotency key
      operationId: getImportReceiptByKey
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
          description: Idempotency key of the receipt
      responses:
        '200':
          description: Durable import receipt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crm2ImportReceipt'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /duplicates/detect:
    post:
      summary: Detect exact duplicate candidates
      description: Deterministically groups records by normalized exact key. Auto-merge is strictly forbidden in V1.
      operationId: detectDuplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectDuplicatesInput'
      responses:
        '200':
          description: Detection results with unique records and held candidate groups
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Auto-merge forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /duplicates/held:
    get:
      summary: List duplicate candidates held for human review
      description: Returns duplicate groups held pending authorized human merge decision.
      operationId: listHeldDuplicates
      parameters:
        - name: batchId
          in: query
          required: false
          schema:
            type: string
        - name: keyType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExactKeyType'
        - name: entity
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of held candidates
          content:
            application/json:
              schema:
                type: object

  /duplicates/resolve:
    post:
      summary: Record human merge decision
      description: Records authorized merge or separation decision with immutable audit log.
      operationId: resolveDuplicateCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDuplicateInput'
      responses:
        '200':
          description: Decision recorded and audit log entry created
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid input or keptId equals mergedId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Candidate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /duplicates/audit:
    get:
      summary: Query duplicate resolution audit logs
      description: Returns paginated audit trail of human merge decisions.
      operationId: getDuplicateAuditLogs
      parameters:
        - name: candidateId
          in: query
          required: false
          schema:
            type: string
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: entity
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated audit logs
          content:
            application/json:
              schema:
                type: object

  /deals/evaluate-duplicate:
    post:
      summary: Evaluate single deal candidate against pool
      operationId: evaluateDealDuplicate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateDealDuplicateInput'
      responses:
        '200':
          description: Deal duplicate evaluation outcome
          content:
            application/json:
              schema:
                type: object

  /quotes/evaluate-duplicate:
    post:
      summary: Evaluate single quote candidate against pool
      operationId: evaluateQuoteDuplicate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateQuoteDuplicateInput'
      responses:
        '200':
          description: Quote duplicate evaluation outcome
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - module
        - name
        - version
      properties:
        status:
          type: string
          example: ok
        module:
          type: string
          example: crm-2
        name:
          type: string
          example: CRM-2 Deals, Pipeline and Quotes
        version:
          type: string
          example: 1.0.0

    StageName:
      type: string
      enum:
        - New
        - Qualified
        - Proposal
        - Negotiation
        - Won
        - Lost
      description: Fixed pipeline stage names

    Stage:
      type: object
      required:
        - id
        - name
        - order
        - is_closed_won
        - is_closed_lost
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/StageName'
        order:
          type: integer
          minimum: 1
          maximum: 6
        is_closed_won:
          type: boolean
        is_closed_lost:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StagesListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Stage'

    Deal:
      type: object
      required:
        - id
        - name
        - contact_id
        - value
        - currency
        - stage_id
        - stage_name
        - close_date
        - is_orphan
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contact_id:
          type: string
          format: uuid
          nullable: true
          description: Nullable foreign key. When null, deal is flagged as orphan.
        contact_name:
          type: string
          nullable: true
        value:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
          description: Decimal string representation
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
        stage_id:
          type: string
          format: uuid
        stage_name:
          $ref: '#/components/schemas/StageName'
        close_date:
          type: string
          format: date
          example: '2026-11-30'
        is_orphan:
          type: boolean
          description: True when contact_id is null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDealInput:
      type: object
      required:
        - name
        - value
        - currency
        - stage_name
        - close_date
      properties:
        name:
          type: string
        contact_id:
          type: string
          format: uuid
          nullable: true
        value:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: USD
        stage_name:
          $ref: '#/components/schemas/StageName'
          default: New
        close_date:
          type: string
          format: date

    UpdateDealInput:
      type: object
      properties:
        name:
          type: string
        contact_id:
          type: string
          format: uuid
          nullable: true
        value:
          type: string
        currency:
          type: string
        stage_name:
          $ref: '#/components/schemas/StageName'
        close_date:
          type: string
          format: date

    Quote:
      type: object
      required:
        - id
        - deal_id
        - quote_number
        - date
        - amount
        - currency
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        deal_id:
          type: string
          format: uuid
        deal_name:
          type: string
        quote_number:
          type: string
        date:
          type: string
          format: date
        amount:
          type: string
          pattern: '^\d+(\.\d{1,4})?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateQuoteInput:
      type: object
      required:
        - deal_id
        - quote_number
        - date
        - amount
        - currency
      properties:
        deal_id:
          type: string
          format: uuid
        quote_number:
          type: string
        date:
          type: string
          format: date
        amount:
          type: string
        currency:
          type: string
          default: USD
        note:
          type: string
          nullable: true

    UpdateQuoteInput:
      type: object
      properties:
        quote_number:
          type: string
        date:
          type: string
          format: date
        amount:
          type: string
        currency:
          type: string
        note:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      required:
        - page
        - pageSize
        - totalCount
        - totalPages
        - hasNextPage
        - hasPreviousPage
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean

    DealsListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deal'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    QuotesListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
            - type: array
              items:
                type: object
            - type: object
          nullable: true
        correlation_id:
          type: string
          description: Unique correlation ID for tracking and audit

    Crm2ImportRow:
      type: object
      required:
        - batchId
        - sourceRow
        - entity
        - idempotencyKey
        - data
      properties:
        batchId:
          type: string
        sourceRow:
          type: integer
          minimum: 1
        sourceSystem:
          type: string
          default: kit_import
        entity:
          type: string
          enum:
            - deal
            - quote
            - stage
            - quote_line
        idempotencyKey:
          type: string
        data:
          type: object

    Crm2ImportReceipt:
      type: object
      required:
        - id
        - batchId
        - sourceRow
        - entity
        - sourceSystem
        - sourceId
        - targetId
        - idempotencyKey
        - payloadHash
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        sourceRow:
          type: integer
        entity:
          type: string
        sourceSystem:
          type: string
        sourceId:
          type: string
        targetId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        payloadHash:
          type: string
        kind:
          type: string
          enum:
            - created
            - linked
        outcome:
          type: string
          enum:
            - created
            - linked
        createdAt:
          type: string
          format: date-time

    Crm2ImportResult:
      type: object
      required:
        - targetId
        - receipt
        - isExisting
      properties:
        targetId:
          type: string
          format: uuid
        receipt:
          $ref: '#/components/schemas/Crm2ImportReceipt'
        isExisting:
          type: boolean
        correlation_id:
          type: string

    Crm2BatchImportRequest:
      type: object
      required:
        - batchId
        - rows
      properties:
        batchId:
          type: string
        sourceSystem:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/Crm2ImportRow'

    Crm2BatchImportResponse:
      type: object
      required:
        - batchId
        - loadedCount
        - rejectedCount
        - loaded
        - errors
      properties:
        batchId:
          type: string
        loadedCount:
          type: integer
        rejectedCount:
          type: integer
        loaded:
          type: array
          items:
            $ref: '#/components/schemas/Crm2ImportResult'
        errors:
          type: array
          items:
            type: object
            required:
              - sourceRow
              - error
            properties:
              sourceRow:
                type: integer
              error:
                type: object
                properties:
                  reasonCode:
                    type: string
                  message:
                    type: string
                  field:
                    type: string

    Crm2ImportReceiptsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Crm2ImportReceipt'
        correlation_id:
          type: string

    ExactKeyType:
      type: string
      enum:
        - deal_business
        - deal_name_contact
        - quote_number
        - quote_line_sku
        - sku
        - email
        - tax_id
        - phone
        - composite
        - source_key

    RecordWithKey:
      type: object
      required:
        - id
        - keyValue
      properties:
        id:
          type: string
        keyValue:
          type: string
        payload:
          type: object

    DetectDuplicatesInput:
      type: object
      required:
        - keyType
        - records
      properties:
        batchId:
          type: string
        entity:
          type: string
          enum: [deal, quote, quote_line]
          default: deal
        keyType:
          $ref: '#/components/schemas/ExactKeyType'
        autoMerge:
          type: boolean
          default: false
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordWithKey'

    ResolveDuplicateInput:
      type: object
      required:
        - candidateId
        - decision
        - actorId
        - keptId
        - mergedId
        - reason
      properties:
        candidateId:
          type: string
        decision:
          type: string
          enum: [MERGE, REJECT_DUPLICATE, KEEP_SEPARATE]
        actorId:
          type: string
        keptId:
          type: string
        mergedId:
          type: string
        reason:
          type: string
        metadata:
          type: object

    EvaluateDealDuplicateInput:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        stageId:
          type: string
        stageName:
          type: string
        contactId:
          type: string
        value:
          type: string
        currency:
          type: string

    EvaluateQuoteDuplicateInput:
      type: object
      required:
        - quoteNumber
      properties:
        id:
          type: string
          format: uuid
        quoteNumber:
          type: string
        dealId:
          type: string
        amount:
          type: string
        currency:
          type: string

