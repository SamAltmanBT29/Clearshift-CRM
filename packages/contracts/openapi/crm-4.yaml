openapi: 3.1.0
info:
  title: ClearShift CRM-4 Marketing Lists and Campaign History API
  version: 1.0.0
  description: >
    Public CRM-4 contract for Marketing Lists and Campaign History.
    Enforces monotonic contact opt-out (BR-CRM4-01), listId immutability on campaigns,
    and strictly allowed member statuses (sent, opened, clicked).
    Outbound delivery/sending workflows are out of scope for V1.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: CRM-4
paths:
  /api/v1/crm-marketing/lists:
    get:
      operationId: listCRM4MarketingLists
      tags: [CRM-4]
      summary: List and search marketing lists
      description: Retrieve marketing lists with optional name search and server pagination. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: search
          in: query
          required: false
          description: Search term to filter lists by name
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-indexed page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Page size (maximum 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated list of marketing lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4ListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createCRM4MarketingList
      tags: [CRM-4]
      summary: Create a marketing list
      description: Create a new marketing list record. Allowed roles - editor, migration_runner, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CRM4ListCreate"
      responses:
        "201":
          description: Marketing list created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4List"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/crm-marketing/lists/{id}:
    patch:
      operationId: patchCRM4MarketingList
      tags: [CRM-4]
      summary: Update a marketing list
      description: Partial update of a marketing list's name and/or description. Allowed roles - editor, admin.
      parameters:
        - name: id
          in: path
          required: true
          description: List UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CRM4ListPatch"
      responses:
        "200":
          description: Marketing list updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4List"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/crm-marketing/campaigns:
    get:
      operationId: listCRM4Campaigns
      tags: [CRM-4]
      summary: List and search marketing campaigns
      description: Retrieve campaigns with optional list filtering and server pagination. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: listId
          in: query
          required: false
          description: Filter campaigns by associated marketing list UUID
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          description: Search term to filter campaigns by name
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-indexed page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Page size (maximum 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated list of campaigns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4CampaignListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createCRM4Campaign
      tags: [CRM-4]
      summary: Create a campaign
      description: Create a campaign linked to a marketing list. Allowed roles - editor, migration_runner, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CRM4CampaignCreate"
      responses:
        "201":
          description: Campaign created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4Campaign"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/crm-marketing/campaigns/{id}:
    get:
      operationId: getCRM4CampaignById
      tags: [CRM-4]
      summary: Retrieve a single campaign by ID
      description: Fetch a campaign by UUID including metadata. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Campaign UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Campaign found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4Campaign"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: patchCRM4Campaign
      tags: [CRM-4]
      summary: Update a campaign
      description: Partial update of a campaign's name and/or date. Note that listId is immutable and cannot be updated. Allowed roles - editor, admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Campaign UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CRM4CampaignPatch"
      responses:
        "200":
          description: Campaign updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4Campaign"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/crm-marketing/campaigns/{id}/members:
    get:
      operationId: listCRM4CampaignMembers
      tags: [CRM-4]
      summary: List members of a campaign
      description: Retrieve members for a campaign filtered by member status with server pagination. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Campaign UUID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter by member status
          schema:
            type: string
            enum: [sent, opened, clicked]
        - name: page
          in: query
          required: false
          description: 1-indexed page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Page size (maximum 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated campaign members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4MemberListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      operationId: createCRM4CampaignMember
      tags: [CRM-4]
      summary: Add a member to a campaign
      description: Add an existing contact to a campaign record. Allowed roles - editor, migration_runner, admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Campaign UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CRM4MemberCreateRequest"
      responses:
        "201":
          description: Member added to campaign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4Member"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/crm-marketing/consents:
    post:
      operationId: setCRM4Consent
      tags: [CRM-4]
      summary: Record or update contact consent status
      description: >
        Set or update consent status for a contact.
        Enforces BR-CRM4-01: An unsubscribed contact cannot be updated to subscribed.
        Allowed roles - editor, migration_runner, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CRM4ConsentSet"
      responses:
        "200":
          description: Consent recorded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4Consent"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          description: Conflict — attempt to overwrite a known unsubscribe with consent (BR-CRM4-01).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/crm-marketing/consents/{contact}:
    get:
      operationId: getCRM4ConsentByContact
      tags: [CRM-4]
      summary: Retrieve consent record for a contact
      description: Get the current consent record for a contact UUID. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: contact
          in: path
          required: true
          description: Contact UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contact consent record found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRM4Consent"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

components:
  schemas:
    CRM4List:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        campaignCount:
          type: integer
          minimum: 0
          default: 0
        memberCount:
          type: integer
          minimum: 0
          default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CRM4ListCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true

    CRM4ListPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true

    CRM4Campaign:
      type: object
      required:
        - id
        - name
        - campaignDate
        - listId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        campaignDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          example: "2026-10-23"
        listId:
          type: string
          format: uuid
        listName:
          type: string
        memberCount:
          type: integer
          minimum: 0
          default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CRM4CampaignCreate:
      type: object
      required:
        - name
        - campaignDate
        - listId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        campaignDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          example: "2026-10-23"
        listId:
          type: string
          format: uuid

    CRM4CampaignPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        campaignDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          example: "2026-10-23"

    CRM4Member:
      type: object
      required:
        - id
        - campaignId
        - contactId
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        status:
          type: string
          enum: [sent, opened, clicked]
        unsubscribed:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    CRM4MemberCreateRequest:
      type: object
      required:
        - contactId
      properties:
        contactId:
          type: string
          format: uuid
        status:
          type: string
          enum: [sent, opened, clicked]
          default: sent
        unsubscribed:
          type: boolean
          default: false

    CRM4Consent:
      type: object
      required:
        - id
        - contactId
        - status
        - consentDate
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        status:
          type: string
          enum: [subscribed, unsubscribed]
        consentDate:
          type: string
          format: date-time
        source:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CRM4ConsentSet:
      type: object
      required:
        - contactId
        - status
        - source
      properties:
        contactId:
          type: string
          format: uuid
        status:
          type: string
          enum: [subscribed, unsubscribed]
        consentDate:
          type: string
          format: date-time
        source:
          type: string
          minLength: 1

    CRM4Pagination:
      type: object
      required:
        - page
        - pageSize
        - totalCount
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalCount:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    CRM4ListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CRM4List"
        pagination:
          $ref: "#/components/schemas/CRM4Pagination"

    CRM4CampaignListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CRM4Campaign"
        pagination:
          $ref: "#/components/schemas/CRM4Pagination"

    CRM4MemberListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CRM4Member"
        pagination:
          $ref: "#/components/schemas/CRM4Pagination"

    ErrorEnvelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    ValidationError:
      description: Request validation failed against schema invariants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenError:
      description: Caller lacks required permissions or role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictError:
      description: Resource conflict or domain invariant violation (e.g. BR-CRM4-01).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
