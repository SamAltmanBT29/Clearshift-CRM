openapi: 3.1.0
info:
  title: ClearShift CRM-3 Support Tickets and Activities API
  version: 1.0.0
  description: >
    Public CRM-3 contract for Service Desk ticketing and activity tracking.
    Enforces status (New, Open, Waiting, Solved, Closed) and priority (Low, Normal, High, Urgent).
    order_ref is a non-relational text reference in V1. Notes are append-only and returned newest-first.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: CRM-3
paths:
  /api/v1/crm-tickets/tickets:
    get:
      operationId: listCRM3Tickets
      tags: [CRM-3]
      summary: List and filter tickets
      description: Retrieve tickets filtered by status and priority with server-side pagination. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [New, Open, Waiting, Solved, Closed]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [Low, Normal, High, Urgent]
        - name: contactId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: List of tickets matching filter criteria.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createCRM3Ticket
      tags: [CRM-3]
      summary: Create a support ticket
      description: Create a support ticket record with optional initial note and order reference. Allowed roles - editor, migration_runner, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreate"
      responses:
        "201":
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/crm-tickets/tickets/{id}:
    get:
      operationId: getCRM3Ticket
      tags: [CRM-3]
      summary: Retrieve ticket by ID
      description: Retrieve a single ticket record with contact/order details. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ticket details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: patchCRM3Ticket
      tags: [CRM-3]
      summary: Update ticket status, priority, or fields
      description: Modify mutable ticket fields. Allowed roles - editor, admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketPatch"
      responses:
        "200":
          description: Updated ticket details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/crm-tickets/tickets/{id}/notes:
    get:
      operationId: listCRM3TicketNotes
      tags: [CRM-3]
      summary: List ticket notes
      description: Retrieve all notes for a specific ticket, sorted newest first. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated list of notes for the ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/crm-tickets/notes:
    post:
      operationId: addCRM3Note
      tags: [CRM-3]
      summary: Append a note to a ticket
      description: Append a new note to a support ticket. Author and timestamp are preserved. Allowed roles - editor, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteCreate"
      responses:
        "201":
          description: Note appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TicketStatus:
      type: string
      enum: [New, Open, Waiting, Solved, Closed]
    TicketPriority:
      type: string
      enum: [Low, Normal, High, Urgent]

    TicketRead:
      type: object
      required:
        - id
        - subject
        - status
        - priority
        - contactId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        contactId:
          type: string
          format: uuid
        orderRef:
          type: string
          nullable: true
        sourceSystem:
          type: string
          nullable: true
        sourceId:
          type: string
          nullable: true
        contactName:
          type: string
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketCreate:
      type: object
      required:
        - subject
        - contactId
      properties:
        subject:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TicketStatus"
          default: New
        priority:
          $ref: "#/components/schemas/TicketPriority"
          default: Normal
        contactId:
          type: string
          format: uuid
        orderRef:
          type: string
          nullable: true
        note:
          type: string
        sourceSystem:
          type: string
          nullable: true
        sourceId:
          type: string
          nullable: true

    TicketPatch:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        contactId:
          type: string
          format: uuid
        orderRef:
          type: string
          nullable: true

    NoteRead:
      type: object
      required:
        - id
        - ticketId
        - authorId
        - noteText
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        authorId:
          type: string
        noteText:
          type: string
        createdAt:
          type: string
          format: date-time

    NoteCreate:
      type: object
      required:
        - ticketId
        - noteText
      properties:
        ticketId:
          type: string
          format: uuid
        noteText:
          type: string
          minLength: 1
        authorId:
          type: string

    TicketListResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TicketRead"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    NoteListResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteRead"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ErrorEnvelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenError:
      description: Caller lacks required permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictError:
      description: Resource conflict or unique violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
