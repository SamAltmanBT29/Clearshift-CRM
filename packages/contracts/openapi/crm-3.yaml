openapi: 3.1.0
info:
  title: ClearShift CRM-3 Support Tickets and Activities API
  version: 1.0.0
  description: >
    Public CRM-3 contract for Service Desk ticketing and activity tracking.
    Enforces status (New, Open, Waiting, Solved, Closed) and priority (Low, Normal, High, Urgent).
    order_ref is a non-relational text reference in V1. Notes are append-only and returned newest-first.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: CRM-3
paths:
  /api/v1/crm-tickets/tickets:
    get:
      operationId: listCRM3Tickets
      tags: [CRM-3]
      summary: List and filter tickets
      description: Retrieve tickets filtered by status and priority with server-side pagination. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [New, Open, Waiting, Solved, Closed]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [Low, Normal, High, Urgent]
        - name: contactId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: List of tickets matching filter criteria.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createCRM3Ticket
      tags: [CRM-3]
      summary: Create a support ticket
      description: >-
        Create a support ticket record with optional initial note and order reference. Allowed roles - editor, migration_runner, admin.
        The ticket and its initial note are written atomically. sourceSystem and sourceId must be sent
        together or not at all (400); a (sourceSystem, sourceId) pair that already exists returns 409
        CONFLICT with detail code duplicate_source_record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreate"
      responses:
        "201":
          description: Ticket created.
          headers:
            Location:
              description: URL of the created ticket, /api/v1/crm-tickets/tickets/{id}.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/crm-tickets/tickets/{id}:
    get:
      operationId: getCRM3Ticket
      tags: [CRM-3]
      summary: Retrieve ticket by ID
      description: Retrieve a single ticket record with contact/order details. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ticket details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: patchCRM3Ticket
      tags: [CRM-3]
      summary: Update ticket status, priority, or fields
      description: >-
        Modify mutable ticket fields. Allowed roles - editor, admin.
        Status changes follow the CRM-3 transition map (New -> Open; Open -> Waiting, Solved;
        Waiting -> Open, Solved; Solved -> Closed, Open; Closed is terminal). Setting the same
        status is an idempotent no-op. An illegal transition returns 422
        INVALID_TICKET_STATUS_TRANSITION and the ticket is left unchanged. An unknown contactId
        returns 422 with detail code invalid_contact_reference.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketPatch"
      responses:
        "200":
          description: Updated ticket details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/TransitionError"

  /api/v1/crm-tickets/tickets/{id}/notes:
    get:
      operationId: listCRM3TicketNotes
      tags: [CRM-3]
      summary: List ticket notes
      description: Retrieve all notes for a specific ticket, sorted newest first. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated list of notes for the ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      operationId: addCRM3TicketNoteByTicketId
      tags: [CRM-3]
      summary: Append a note to a ticket by ticket ID
      description: Append a new note directly referencing the parent ticket path parameter. Allowed roles - editor, admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - noteText
              properties:
                noteText:
                  type: string
                  minLength: 1
                authorId:
                  type: string
      responses:
        "201":
          description: Note appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/crm-tickets/notes:
    post:
      operationId: addCRM3Note
      tags: [CRM-3]
      summary: Append a note to a ticket
      description: >-
        Append a new note to a support ticket. Author and timestamp are preserved. Allowed roles - editor, admin.
        The author is the authenticated user (token sub). An authorId that names a different user
        returns 403 AUTHOR_MISMATCH and no note is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteCreate"
      responses:
        "201":
          description: Note appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/crm-tickets/imports:
    post:
      operationId: createCRM3Import
      tags: [CRM-3]
      summary: Create an import batch for tickets/notes
      description: Import migration batch processed and receipts persisted. Allowed roles - migration_runner, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCreate"
      responses:
        "201":
          description: Import batch created and loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/crm-tickets/imports/{batch}:
    get:
      operationId: getCRM3Import
      tags: [CRM-3]
      summary: Get import batch status and receipts
      description: Retrieve import batch metadata and committed row receipts. Allowed roles - viewer, analyst, admin.
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import batch detail with receipts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TicketStatus:
      type: string
      enum: [New, Open, Waiting, Solved, Closed]
    TicketPriority:
      type: string
      enum: [Low, Normal, High, Urgent]

    TicketRead:
      type: object
      required:
        - id
        - subject
        - status
        - priority
        - contactId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        contactId:
          type: string
          format: uuid
        orderRef:
          type: string
          nullable: true
        sourceSystem:
          type: string
          nullable: true
        sourceId:
          type: string
          nullable: true
        contactName:
          type: string
          nullable: true
        contactEmail:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketCreate:
      type: object
      required:
        - subject
        - contactId
      properties:
        subject:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TicketStatus"
          default: New
        priority:
          $ref: "#/components/schemas/TicketPriority"
          default: Normal
        contactId:
          type: string
          format: uuid
        orderRef:
          type: string
          nullable: true
        note:
          type: string
        sourceSystem:
          type: string
          nullable: true
        sourceId:
          type: string
          nullable: true

    TicketPatch:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        contactId:
          type: string
          format: uuid
        orderRef:
          type: string
          nullable: true

    NoteRead:
      type: object
      required:
        - id
        - ticketId
        - authorId
        - noteText
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        authorId:
          type: string
        noteText:
          type: string
        createdAt:
          type: string
          format: date-time

    NoteCreate:
      type: object
      required:
        - ticketId
        - noteText
      properties:
        ticketId:
          type: string
          format: uuid
        noteText:
          type: string
          minLength: 1
        authorId:
          type: string
          description: >-
            Optional. When authenticated, must equal the token subject or be omitted; the server
            always records the authenticated user as author.

    TicketListResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TicketRead"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    NoteListResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteRead"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ImportStatus:
      type: string
      enum: [pending, processing, completed, failed]

    ImportCreate:
      type: object
      required:
        - sourceSystem
      properties:
        sourceSystem:
          type: string
          minLength: 1
        batchId:
          type: string
          format: uuid
        rows:
          type: array
          items:
            type: object
            properties:
              sourceRow:
                type: integer
                minimum: 1
              entity:
                type: string
                enum: [ticket, note]
              sourceId:
                type: string

    ImportBatch:
      type: object
      required:
        - id
        - sourceSystem
        - status
        - loadedCount
        - rejectedCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sourceSystem:
          type: string
        status:
          $ref: "#/components/schemas/ImportStatus"
        idempotencyKey:
          type: string
          nullable: true
        requestHash:
          type: string
          nullable: true
        loadedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    ImportReceipt:
      type: object
      required:
        - id
        - batchId
        - sourceRow
        - entity
        - sourceSystem
        - sourceId
        - targetId
        - idempotencyKey
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        sourceRow:
          type: integer
          minimum: 1
        entity:
          type: string
          enum: [ticket, note]
        sourceSystem:
          type: string
        sourceId:
          type: string
        targetId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        createdAt:
          type: string
          format: date-time

    ImportBatchDetail:
      allOf:
        - $ref: "#/components/schemas/ImportBatch"
        - type: object
          properties:
            receipts:
              type: array
              items:
                $ref: "#/components/schemas/ImportReceipt"

    ErrorEnvelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
        correlation_id:
          type: string

  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenError:
      description: Caller lacks required permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TransitionError:
      description: >-
        Domain rule violated. code is INVALID_TICKET_STATUS_TRANSITION for an illegal status change
        (details[0].code invalid_transition) or VALIDATION_ERROR for an unknown contact reference
        (details[0].code invalid_contact_reference).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictError:
      description: Resource conflict or unique violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
