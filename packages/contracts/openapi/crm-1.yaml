openapi: 3.1.0
info:
  title: ClearShift CRM-1 Contacts, Companies and Leads API
  version: 1.0.0
  description: >
    Public CRM-1 contract. Contact search matches names and email and is
    server-paged. Exact duplicate candidates require review; imports never
    fuzzy auto-merge and older imports cannot replace consent or unsubscribe state.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: CRM-1
paths:
  /api/v1/crm-contacts/contacts:
    get:
      operationId: listCRM1Contacts
      tags: [CRM-1]
      summary: Search and page contacts
      description: Contacts matching the name or email search, with server pagination. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Contacts matching the name or email search, with server pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createCRM1Contact
      tags: [CRM-1]
      summary: Create a contact
      description: Create a contact record. Allowed roles - editor, migration_runner, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
      responses:
        "201":
          description: Contact created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/crm-contacts/contacts/{id}:
    get:
      operationId: getCRM1Contact
      tags: [CRM-1]
      summary: Retrieve a contact by UUID
      description: Retrieve a contact record by UUID. Allowed roles - viewer, editor, analyst, admin.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Contact record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: updateCRM1Contact
      tags: [CRM-1]
      summary: Update a contact
      description: Update an existing contact record. Allowed roles - editor, migration_runner, admin.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactPatch"
      responses:
        "200":
          description: Contact updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/crm-contacts/companies:
    get:
      operationId: listCRM1Companies
      tags: [CRM-1]
      summary: List companies
      description: Server-paged companies. Allowed roles - viewer, editor, admin.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Server-paged companies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createCRM1Company
      tags: [CRM-1]
      summary: Create a company
      description: Create a company record. Allowed roles - editor, migration_runner, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreate"
      responses:
        "201":
          description: Company created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/crm-contacts/companies/{id}:
    get:
      operationId: getCRM1Company
      tags: [CRM-1]
      summary: Retrieve a company by UUID
      description: Retrieve a company record by UUID. Allowed roles - viewer, editor, admin.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Company record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: updateCRM1Company
      tags: [CRM-1]
      summary: Update a company
      description: Update an existing company record. Allowed roles - editor, migration_runner, admin.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPatch"
      responses:
        "200":
          description: Company updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/crm-contacts/leads:
    get:
      operationId: listCRM1Leads
      tags: [CRM-1]
      summary: List leads
      description: Server-paged leads. Allowed roles - viewer, editor, admin.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Server-paged leads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createCRM1Lead
      tags: [CRM-1]
      summary: Create a lead
      description: Create a lead record. Allowed roles - editor, migration_runner, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreate"
      responses:
        "201":
          description: Lead created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/crm-contacts/leads/{id}:
    get:
      operationId: getCRM1Lead
      tags: [CRM-1]
      summary: Retrieve a lead by UUID
      description: Retrieve a lead record by UUID. Allowed roles - viewer, editor, admin.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Lead record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: updateCRM1Lead
      tags: [CRM-1]
      summary: Update a lead
      description: Update an existing lead record. Allowed roles - editor, migration_runner, admin.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadPatch"
      responses:
        "200":
          description: Lead updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadRead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          description: >
            Invalid input or forbidden lead status transition. A forbidden
            transition returns code INVALID_LEAD_STATUS_TRANSITION.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/crm-contacts/imports:
    post:
      operationId: createCRM1Import
      tags: [CRM-1]
      summary: Start an import
      description: Import processed and its batch result persisted. Allowed roles - migration_runner, admin.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable caller-generated key. A retry returns the original batch and receipts.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCreate"
      responses:
        "201":
          description: Import processed and its batch result persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/crm-contacts/imports/{batch}:
    get:
      operationId: getCRM1Import
      tags: [CRM-1]
      summary: Get import status and receipts
      description: Import batch and committed row receipts. Allowed roles - viewer, analyst, admin.
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import batch and committed row receipts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/crm-contacts/imports/{batch}/rejects:
    get:
      operationId: listCRM1ImportRejects
      tags: [CRM-1]
      summary: List import rejects
      description: Server-paged rejects for the import. Allowed roles - viewer, analyst, admin.
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Server-paged rejects for the import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v1/crm-contacts/import/row:
    post:
      operationId: importCRM1Row
      tags: [CRM-1]
      summary: Import mapped row via Target Adapter (KIT-08)
      description: Safely loads a mapped V1 record through the public API. Commits target mutation and durable receipt atomically.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Correlation-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-Simulate-503
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, sourceRow, entity, data, idempotencyKey]
              properties:
                batchId: { type: string }
                sourceRow: { type: integer, minimum: 1 }
                sourceSystem: { type: string }
                sourceId: { type: string }
                entity: { type: string, enum: [contacts, companies, leads, contact, company, lead] }
                data: { type: object }
                idempotencyKey: { type: string }
                correlationId: { type: string }
                schemaVersion: { type: integer, default: 1 }
      responses:
        "201":
          description: Row created and durable receipt committed.
        "200":
          description: Idempotent replay of previously committed row.
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Temporary infrastructure error. Retryable.
  /api/v1/crm-contacts/import/receipts:
    get:
      operationId: listCRM1ImportReceipts
      tags: [CRM-1]
      summary: List durable import receipts
      description: Retrieve audit receipts committed by the Target Adapter.
      responses:
        "200":
          description: List of import receipts.
  /api/v1/crm-contacts/import/receipts/{idempotencyKey}:
    get:
      operationId: getCRM1ImportReceiptByKey
      tags: [CRM-1]
      summary: Get durable import receipt by idempotency key
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Durable import receipt.
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/crm-contacts/batches/execute-load:
    post:
      summary: Execute chunked batch load with bounded retries and stop threshold
      description: Slices input into 500-row chunks, retries transient failures with exponential backoff while preserving idempotency keys, and stops immediately if failures exceed 10%.
      operationId: executeCRM1BatchLoad
      tags: [CRM-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteBatchLoadInput'
      responses:
        '200':
          description: Batch load execution report with status (COMPLETED or STOPPED_EXCESSIVE_FAILURES)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExecutionReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Batch stopped due to excessive failures (>10%)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crm-contacts/batches/{batchId}/report:
    get:
      summary: Get batch load execution report
      description: Retrieves the durable execution report for a previously executed batch load.
      operationId: getCRM1BatchReport
      tags: [CRM-1]
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch load report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExecutionReport'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/crm-contacts/duplicates/detect:
    post:
      summary: Detect exact duplicate candidates
      description: Deterministically groups records by normalized exact key. Auto-merge is strictly forbidden in V1.
      operationId: detectCRM1Duplicates
      tags: [CRM-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectDuplicatesInput'
      responses:
        '200':
          description: Detection results with unique records and held candidate groups
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          description: Auto-merge forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crm-contacts/duplicates/held:
    get:
      summary: List duplicate candidates held for human review
      description: Returns duplicate groups held pending authorized human merge decision.
      operationId: listCRM1HeldDuplicates
      tags: [CRM-1]
      parameters:
        - name: batchId
          in: query
          required: false
          schema:
            type: string
        - name: keyType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExactKeyType'
        - name: entity
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of held candidates
          content:
            application/json:
              schema:
                type: object

  /api/v1/crm-contacts/duplicates/resolve:
    post:
      summary: Record human merge decision
      description: Records authorized merge or separation decision with immutable audit log.
      operationId: resolveCRM1DuplicateCandidate
      tags: [CRM-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDuplicateInput'
      responses:
        '200':
          description: Decision recorded and audit log entry created
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/crm-contacts/duplicates/audit:
    get:
      summary: Query duplicate resolution audit logs
      description: Returns paginated audit trail of human merge decisions.
      operationId: getCRM1DuplicateAuditLogs
      tags: [CRM-1]
      parameters:
        - name: candidateId
          in: query
          required: false
          schema:
            type: string
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: entity
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated duplicate resolution audit logs
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnauthorizedError:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenError:
      description: The authenticated user lacks the required capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: An unexpected failure occurred; the response includes a correlation ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundError:
      description: The requested CRM-1 record or referenced record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ConflictError:
      description: The request conflicts with an existing identifier or CRM-1 state invariant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnauthorizedError:
      description: Authentication required or invalid/expired/disabled token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenError:
      description: Authenticated identity does not possess the required role for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Contact:
      type: object
      required: [id, firstName, lastName, email, phone, address, companyId, leadStatus, goldenId, sourceSystem, sourceId, consentStatus, consentUpdatedAt, unsubscribed, unsubscribedUpdatedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        companyId: { type: [string, "null"], format: uuid }
        leadStatus: { $ref: "#/components/schemas/LeadStatusOrNull" }
        goldenId: { type: string }
        sourceSystem: { type: [string, "null"] }
        sourceId: { type: [string, "null"] }
        consentStatus: { $ref: "#/components/schemas/ConsentStatus" }
        consentUpdatedAt: { type: [string, "null"], format: date-time }
        unsubscribed: { type: boolean }
        unsubscribedUpdatedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContactRead:
      allOf:
        - $ref: "#/components/schemas/Contact"
        - type: object
          required: [companyName]
          properties:
            companyName: { type: [string, "null"] }
    ContactCreate:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        companyId: { type: [string, "null"], format: uuid }
        leadStatus: { $ref: "#/components/schemas/LeadStatusOrNull" }
    ContactPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        companyId: { type: [string, "null"], format: uuid }
        leadStatus: { $ref: "#/components/schemas/LeadStatusOrNull" }
    ContactList:
      allOf:
        - $ref: "#/components/schemas/PageResult"
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContactRead" }
    Company:
      type: object
      required: [id, name, taxNumber, email, phone, address, sourceSystem, sourceId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        taxNumber: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        sourceSystem: { type: [string, "null"] }
        sourceId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompanyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        taxNumber: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
    CompanyPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        taxNumber: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
    CompanyList:
      allOf:
        - $ref: "#/components/schemas/PageResult"
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Company" }
    LeadStatus:
      type: string
      enum: [New, Working, Qualified, Closed]
    LeadStatusOrNull:
      oneOf:
        - $ref: "#/components/schemas/LeadStatus"
        - type: "null"
    ConsentStatus:
      type: string
      enum: [unknown, granted, withdrawn]
    Lead:
      type: object
      required: [id, contactId, status, sourceSystem, sourceId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/LeadStatus" }
        sourceSystem: { type: [string, "null"] }
        sourceId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeadRead:
      allOf:
        - $ref: "#/components/schemas/Lead"
        - type: object
          required: [contactName, contactEmail]
          properties:
            contactName: { type: string, minLength: 1 }
            contactEmail: { type: [string, "null"], format: email }
    LeadCreate:
      type: object
      additionalProperties: false
      required: [contactId, status]
      properties:
        contactId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/LeadStatus" }
    LeadPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        Lead status changes may only advance New to Working, Working to Qualified,
        and Qualified to Closed. Unchanged status is an idempotent update.
      properties:
        contactId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/LeadStatus" }
    LeadList:
      allOf:
        - $ref: "#/components/schemas/PageResult"
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LeadRead" }
    ImportCreate:
      type: object
      additionalProperties: false
      required: [batchId, sourceSystem, rows]
      properties:
        batchId: { type: string, format: uuid }
        sourceSystem: { type: string, minLength: 1 }
        rows:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [entity, sourceRow, data]
                properties:
                  entity: { const: contact }
                  sourceRow: { type: integer, minimum: 1 }
                  data: { $ref: "#/components/schemas/ContactImportData" }
              - type: object
                additionalProperties: false
                required: [entity, sourceRow, data]
                properties:
                  entity: { const: company }
                  sourceRow: { type: integer, minimum: 1 }
                  data: { $ref: "#/components/schemas/CompanyImportData" }
              - type: object
                additionalProperties: false
                required: [entity, sourceRow, data]
                properties:
                  entity: { const: lead }
                  sourceRow: { type: integer, minimum: 1 }
                  data: { $ref: "#/components/schemas/LeadImportData" }
    ContactImportData:
      type: object
      additionalProperties: false
      required: [firstName, lastName, sourceId]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        companyId: { type: [string, "null"], format: uuid }
        leadStatus: { $ref: "#/components/schemas/LeadStatusOrNull" }
        sourceId: { type: string, minLength: 1 }
    CompanyImportData:
      type: object
      additionalProperties: false
      required: [name, sourceId]
      properties:
        name: { type: string, minLength: 1 }
        taxNumber: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        sourceId: { type: string, minLength: 1 }
    LeadImportData:
      type: object
      additionalProperties: false
      required: [contactId, status, sourceId]
      properties:
        contactId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/LeadStatus" }
        sourceId: { type: string, minLength: 1 }
    ImportBatch:
      type: object
      required: [id, sourceSystem, status, loadedCount, rejectedCount, createdAt, updatedAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        sourceSystem: { type: string }
        status: { type: string, enum: [pending, processing, completed, failed] }
        loadedCount: { type: integer, minimum: 0 }
        rejectedCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    ImportBatchDetail:
      allOf:
        - $ref: "#/components/schemas/ImportBatch"
      properties:
        receipts:
          type: array
          items:
            type: object
            required: [sourceRow, entity, targetId, createdAt]
            properties:
              sourceRow: { type: integer, minimum: 1 }
              entity: { type: string, enum: [contact, company, lead] }
              targetId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
    Reject:
      type: object
      required: [id, batchId, sourceRow, entity, reasonCode, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        sourceRow: { type: integer, minimum: 1 }
        entity: { type: string, enum: [contact, company, lead] }
        reasonCode: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
    RejectList:
      allOf:
        - $ref: "#/components/schemas/PageResult"
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Reject" }
    PageResult:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, default: 25 }
        total: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [code, message, details, correlation_id]
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string }
        details:
          type: array
          items:
            type: object
            required: [message]
            properties:
              field: { type: string }
              message: { type: string }
              code: { type: string }
    DomainEventEnvelope:
      type: object
      required: [id, eventType, aggregateType, aggregateId, timestamp, version, producer, payload]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        aggregateType: { type: string }
        aggregateId: { type: string }
        timestamp: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        producer: { type: string, default: "crm-1" }
        correlationId: { type: string }
        causationId: { type: string }
        payload: { type: object }
    EventContactCreated:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.contact.created" }
        aggregateType: { type: string, const: "Contact" }
    EventContactUpdated:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.contact.updated" }
        aggregateType: { type: string, const: "Contact" }
    EventContactMerged:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.contact.merged" }
        aggregateType: { type: string, const: "Contact" }
    EventCompanyCreated:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.company.created" }
        aggregateType: { type: string, const: "Company" }
    EventCompanyUpdated:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.company.updated" }
        aggregateType: { type: string, const: "Company" }
    EventLeadCreated:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.lead.created" }
        aggregateType: { type: string, const: "Lead" }
    EventLeadStatusChanged:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.lead.status_changed" }
        aggregateType: { type: string, const: "Lead" }
    EventContactConsentChanged:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.contact.consent_changed" }
        aggregateType: { type: string, const: "Contact" }
    EventImportBatchLoaded:
      allOf:
        - $ref: "#/components/schemas/DomainEventEnvelope"
      properties:
        eventType: { type: string, const: "crm.import.batch_loaded" }
        aggregateType: { type: string, const: "ImportBatch" }
    ExactKeyType:
      type: string
      enum:
        - email
        - phone_name
        - tax_number
        - tax_id
        - phone
        - sku
        - composite
        - source_key
    RecordWithKey:
      type: object
      required:
        - id
        - keyValue
      properties:
        id:
          type: string
        keyValue:
          type: string
        payload:
          type: object
    DetectDuplicatesInput:
      type: object
      required:
        - keyType
        - records
      properties:
        batchId:
          type: string
        entity:
          type: string
          enum: [contact, company, lead]
          default: contact
        keyType:
          $ref: '#/components/schemas/ExactKeyType'
        autoMerge:
          type: boolean
          default: false
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordWithKey'
    ResolveDuplicateInput:
      type: object
      required:
        - candidateId
        - decision
        - actorId
        - keptId
        - mergedId
        - reason
      properties:
        candidateId:
          type: string
        decision:
          type: string
          enum: [MERGE, REJECT_DUPLICATE, KEEP_SEPARATE]
        actorId:
          type: string
        keptId:
          type: string
        mergedId:
          type: string
        reason:
          type: string
        metadata:
          type: object
    DuplicateCandidate:
      type: object
      required:
        - id
        - keyType
        - normalizedKey
        - recordIds
        - status
        - detectedAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        module:
          type: string
          default: crm-1
        entity:
          type: string
          default: contact
        keyType:
          $ref: '#/components/schemas/ExactKeyType'
        normalizedKey:
          type: string
        recordIds:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [unique, duplicate_candidate, held_for_review, resolved]
        detectedAt:
          type: string
          format: date-time
        metadata:
          type: object
    DuplicateAuditLogEntry:
      type: object
      required:
        - id
        - candidateId
        - decision
        - actorId
        - timestamp
        - keptId
        - mergedId
        - reason
        - keyType
        - normalizedKey
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [MERGE, REJECT_DUPLICATE, KEEP_SEPARATE]
        actorId:
          type: string
        timestamp:
          type: string
          format: date-time
        keptId:
          type: string
        mergedId:
          type: string
        reason:
          type: string
        keyType:
          $ref: '#/components/schemas/ExactKeyType'
        normalizedKey:
          type: string
        entity:
          type: string
          default: contact
        metadata:
          type: object
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
    BatchExecutionStatus:
      type: string
      enum: [COMPLETED, STOPPED_EXCESSIVE_FAILURES, FAILED]
    BatchRecordInput:
      type: object
      required:
        - sourceRow
        - idempotencyKey
        - data
      properties:
        sourceRow:
          type: integer
          minimum: 1
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
    ExecuteBatchLoadInput:
      type: object
      required:
        - batchId
        - records
      properties:
        batchId:
          type: string
          minLength: 1
          maxLength: 128
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
          default: crm-1
        step:
          type: string
          enum: [extract, profile, clean, map, load, validate, reconcile]
          default: load
        chunkSize:
          type: integer
          default: 500
        maxRetries:
          type: integer
          default: 3
        failureThreshold:
          type: number
          default: 0.10
        minAttemptedRows:
          type: integer
          default: 50
        records:
          type: array
          items:
            $ref: '#/components/schemas/BatchRecordInput'
    BatchReceipt:
      type: object
      required:
        - batchId
        - sourceRow
        - idempotencyKey
        - targetId
        - committedAt
      properties:
        batchId:
          type: string
        sourceRow:
          type: integer
        idempotencyKey:
          type: string
        targetId:
          type: string
        kind:
          type: string
          enum: [created, linked]
          default: created
        committedAt:
          type: string
          format: date-time
    FailedRow:
      type: object
      required:
        - sourceRow
        - idempotencyKey
        - errorCode
        - errorMessage
        - retryAttempts
      properties:
        sourceRow:
          type: integer
        idempotencyKey:
          type: string
        errorCode:
          type: string
        errorMessage:
          type: string
        retryAttempts:
          type: integer
        payloadHash:
          type: string
    BatchExecutionReport:
      type: object
      required:
        - batchId
        - module
        - step
        - status
        - totalRecords
        - attemptedRecords
        - committedRecords
        - failedRecords
        - chunksProcessed
        - chunkSize
        - failureRate
        - committedReceipts
        - failedRows
        - executedAt
      properties:
        batchId:
          type: string
        module:
          type: string
          enum: [crm-1, crm-2, crm-3, crm-4, crm-5]
        step:
          type: string
        status:
          $ref: '#/components/schemas/BatchExecutionStatus'
        totalRecords:
          type: integer
        attemptedRecords:
          type: integer
        committedRecords:
          type: integer
        failedRecords:
          type: integer
        chunksProcessed:
          type: integer
        chunkSize:
          type: integer
        failureRate:
          type: number
        haltReason:
          type: string
          nullable: true
        committedReceipts:
          type: array
          items:
            $ref: '#/components/schemas/BatchReceipt'
        failedRows:
          type: array
          items:
            $ref: '#/components/schemas/FailedRow'
        executedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

